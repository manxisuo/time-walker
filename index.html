<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时空旅人 · Three.js</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(170,215,255,.75) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#title{position:fixed;left:0;right:0;top:calc(14vh + env(safe-area-inset-top));text-align:center;pointer-events:none;opacity:0}
#title.show{animation:tt 3.6s ease forwards}
#title b{display:block;font-size:clamp(34px,8vw,84px);letter-spacing:.18em;text-shadow:0 0 24px currentColor,0 0 60px rgba(255,255,255,.4)}
#title span{display:block;margin-top:10px;font-size:clamp(14px,2.4vw,22px);letter-spacing:.3em;opacity:.85}
@keyframes tt{0%{opacity:0;transform:scale(1.15);filter:blur(8px)}15%{opacity:1;transform:scale(1);filter:none}75%{opacity:1}100%{opacity:0}}
#hud{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 max(6px,env(safe-area-inset-left)) 0 max(6px,env(safe-area-inset-right))}
#hud-btns{display:flex;gap:8px;flex-shrink:0}
#hud button{font:inherit;font-size:14px;height:38px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:19px;background:rgba(10,10,25,.55);color:#fff;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap;flex-shrink:0}
#hud button.on{background:#fff;color:#111}
#hud button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#chips{display:flex;gap:5px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 4px;scroll-snap-type:x mandatory;touch-action:pan-x}
#chips::-webkit-scrollbar{display:none}
#chips button{font-size:12px;height:32px;padding:0 8px;scroll-snap-align:start;min-width:max-content;touch-action:manipulation}
#cn{position:fixed;right:max(16px,env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));font-size:20px;font-weight:700;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s}
#tip{position:fixed;left:max(16px,env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));font-size:12px;opacity:.7;text-shadow:0 1px 4px #000}
@media(max-width:480px){#tip{display:none}}
</style>
</head>
<body>
<div id="fx"></div><div id="flash"></div>
<div id="title"><b></b><span></span></div>
<div id="cn"></div><div id="tip">拖动画面转动视角　←→ 切换世界　空格暂停</div>
<div id="hud"><div id="hud-btns"><button id="bp">暂停</button><button id="bs">🔇 开启音效</button></div><div id="chips"></div></div>

{n:'时间齿轮城',s:'齿轮咬合，钟声一响，时间便开始倒流',bg:'#3a2412',gr:'#2a1d14',hs:'#ffb866',dl:'#ffd9a0',pc:'#ffcf80',pv:[0,.8],ps:.3,coat:'#7ad3c8',st:0,gd:0,bl:.8},

];

const renderer=new THREE.WebGLRenderer({antialias:!isMobileDevice});

document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0,15,170);scene.background=new THREE.Color();
const cam=new THREE.PerspectiveCamera(62,1,.1,1200);
const hemi=new THREE.HemisphereLight(0xffffff,0x222233,.55),dir=new THREE.DirectionalLight(0xffffff,1.1);

const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,cam));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(1,1),isMobileDevice?.6:.9,.5,isMobileDevice?.8:.6);composer.addPass(bloom);
function resize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return new THREE.CanvasTexture(c)};
const glowTex=cv(128,128,x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(.3,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});

const winTex=cv(128,256,x=>{x.fillStyle='#000';x.fillRect(0,0,128,256);for(let r=0;r<16;r++)for(let c=0;c<8;c++)if(R(r*9+c)>.45){x.fillStyle=['#ffd27a','#7ae7ff','#ff7ae0'][(r+c)%3];x.fillRect(c*16+3,r*16+3,10,10)}});

const PM=(c,s)=>new THREE.PointsMaterial({color:c,size:s,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});

{const cyp=M('#12351f');

 for(let k=0;k<7;k++){const r=mesh(new THREE.TorusGeometry(3+R(k)*2,.2,8,40),M('#000',k%2?'#ff3fd0':'#22e0ff'),X(k+300,14,24),16+R(k)*20,Z(1,k+310));anim.push(t=>{r.rotation.x=t*.8+k;r.rotation.y=t*.5})}}

{[[-55,-40,20],[62,-85,26],[-30,-120,14]].forEach(([x,z,s])=>{const p=mesh(new THREE.ConeGeometry(s*1.4,s*1.4,4),M('#d7a455'),x,s*.7,-2*L+z);p.rotation.y=.785});

{const pm=M('#1d4a3a'),sm=M('#fff');

{const rk=M('#7b7b84');

 for(let k=0;k<30;k++){const s=.6+R(k)*1.8;mesh(new THREE.DodecahedronGeometry(s),rk,X(k+800,6,50),s*.5,Z(4,k+810))}

// 5 星海漫游
{const P=-5*L;mesh(new THREE.SphereGeometry(40,48,48),new THREE.MeshStandardMaterial({color:'#7a5cff',emissive:'#2a1a66',roughness:.7}),-85,48,P-95);

 const ast=[];for(let k=0;k<44;k++){const s=.8+R(k)*2.6;ast.push(mesh(new THREE.DodecahedronGeometry(s),M('#6b6f85'),X(k+900,8,55),3+R(k+1)*26,Z(5,k+910)))}

{const pal=['#ff6b81','#ffa94d','#b197fc','#63e6be'],sw=[],S=-6*L;
